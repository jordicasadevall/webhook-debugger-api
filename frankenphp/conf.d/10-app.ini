expose_php = 0
date.timezone = UTC
apc.enable_cli = 1
session.use_strict_mode = 1
zend.detect_unicode = 0

; Hard backstop against oversized request bodies. Requests declaring a
; Content-Length above this are rejected by PHP itself before the body is
; buffered into worker memory, instead of relying solely on the app-level
; 1MB check in WebhookController (which only runs after the full body has
; already been read). Set with headroom above that business limit so
; ordinary over-1MB requests still reach the app and get a clean 413 JSON
; response; only grossly oversized requests hit this lower-level cutoff.
post_max_size = 2M
upload_max_filesize = 2M

; https://symfony.com/doc/current/performance.html
realpath_cache_size = 4096K
realpath_cache_ttl = 600
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 32531
opcache.memory_consumption = 256
opcache.enable_file_override = 1
