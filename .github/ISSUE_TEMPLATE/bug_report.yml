name: Bug report
description: Something isn't working as expected
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Minimal steps, ideally including the exact `curl` command(s) used.
      placeholder: |
        1. `docker compose up --wait`
        2. `curl -sk -X POST https://localhost/inboxes`
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version / commit
      description: Output of `git rev-parse HEAD`, or the release tag.
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      render: shell
