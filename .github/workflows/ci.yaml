---
name: CI

on:
  push:
    branches:
      - main
  pull_request: ~
  workflow_dispatch: ~

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build Docker images
        uses: docker/bake-action@v7
        with:
          pull: true
          load: true
          source: .
          files: |
            compose.yaml
            compose.override.yaml
          set: |
            *.cache-from=type=gha,scope=${{github.ref}}
            *.cache-from=type=gha,scope=refs/heads/main
            *.cache-to=type=gha,scope=${{github.ref}},mode=max
      - name: Start services
        run: docker compose up --wait --no-build
      - name: Dump service logs on failure
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs
      - name: Check HTTP reachability
        # Port matches HTTPS_PORT in .env, which docker compose reads directly.
        run: curl -v --insecure --fail-with-body https://localhost:8443/docs
      - name: Create test database
        run: docker compose exec -T php bin/console -e test doctrine:database:create
      - name: Run migrations
        run: docker compose exec -T php bin/console -e test doctrine:migrations:migrate --no-interaction
      - name: Run PHPUnit
        run: docker compose exec -T php bin/phpunit
      - name: Doctrine Schema Validator
        run: docker compose exec -T php bin/console -e test doctrine:schema:validate
  lint:
    name: Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      statuses: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Lint Code Base
        uses: super-linter/super-linter/slim@v8
        env:
          GITHUB_ACTIONS_CONFIG_FILE: actionlint.yaml
          MARKDOWN_CONFIG_FILE: .markdownlint.yml
          GITLEAKS_CONFIG_FILE: .gitleaks.toml
          # config/reference.php is auto-generated by Symfony (see its own
          # header comment) and docs/open-source-release.md is an internal
          # planning note, not maintained documentation — neither should be
          # held to source/prose linting standards.
          FILTER_REGEX_EXCLUDE: (^|/)config/reference\.php$|(^|/)docs/open-source-release\.md$
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VALIDATE_CHECKOV: false
          VALIDATE_TRIVY: false
          VALIDATE_BIOME_FORMAT: false
          VALIDATE_BIOME_LINT: false
          # Super-linter's own PHP is older than this project's composer.json
          # requirement (>=8.5.8, matching the Dockerfile's runtime), so its
          # composer install for these validators always fails on platform
          # requirements. Disabled here; PHPUnit's Tests job is what actually
          # exercises the code.
          VALIDATE_PHP_BUILTIN: false
          VALIDATE_PHP_PHPCS: false
          VALIDATE_PHP_PHPSTAN: false
          VALIDATE_PHP_PSALM: false
          # config/reference.php is Symfony-generated and self-similar by
          # construction (repeated doc-comment blocks); FILTER_REGEX_EXCLUDE
          # doesn't reach JSCPD's own file discovery, so disable it outright
          # rather than flag duplication in code we don't author.
          VALIDATE_JSCPD: false
